[package]
name = "couchbase-core"
version = "1.0.1"
edition = "2021"
description = "Couchbase SDK core networking and protocol implementation, not intended for direct use"
license = "Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/couchbaselabs/couchbase-rs"
authors = [
    "Charles Dixon <charles.dixon@couchbase.com>",
    "Matt Wozakowski <matt.wozakowski@couchbase.com>",
    "Will Broadbelt <william.broadbelt@couchbase.com>"
]

[dependencies]
arc-swap = "1.8"
async-trait = "0.1.89"
base64 = "0.22.1"
bitflags = "2.11"
byteorder = "1.5"
bytes = "1.11"
chrono = "0.4.44"
crc32fast = "1.5"
futures = "0.3.32"
hmac = "0.12.1"
http = "1.4"
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
rand = "0.10.0"
regex = "1.12"
reqwest = { version = "0.13.2", features = ["json", "stream"], default-features = false }
sha1 = "0.10.6"
sha2 = "0.10.9"
snap = "1.1"
socket2 = "0.6.3"
tracing = { version = "0.1.44", features = ["log"] }
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.22", features = ["v4"] }

dhat = { version = "0.3.3", optional = true }
futures-core = "0.3.32"
prost-build = { version = "0.14.4", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

tokio = { version = "1.50", features = ["full"] }
tokio-native-tls = { version = "0.3.1", optional = true }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec"] }

tokio-rustls = { version = "0.26.4", optional = true }

[dev-dependencies]
chrono = "0.4.44"
env_logger = "0.11.9"
envconfig = "0.11.1"
log = "0.4.29"
serial_test = "3.4"
# test-util is not part of tokio's "full", and the memdx pipelining tests need its paused
# clock: it only advances when every task is parked, which is how they tell that the code
# under test has stopped writing and is waiting to be answered.
tokio = { version = "1.50", features = ["test-util"] }
tracing-subscriber = "0.3.22"

couchbase-connstr = { path = "../couchbase-connstr", version = "1.0.1" }
# A self-signed certificate for the loopback TLS test server in
# indexerx::test_server. Generated in-process and never written anywhere, which
# is the whole reason for the dependency: a checked-in key would be a key in the
# repository, and one with an expiry date.
rcgen = { version = "0.14.9", default-features = false, features = ["crypto", "ring"] }

[[bin]]
name = "gen-indexerx-proto"
path = "src/bin/gen_indexerx_proto.rs"
required-features = ["proto-codegen"]

[features]
dhat-heap = ["dhat"]

# Regenerating indexerx's protobuf bindings. Off by default, and deliberately
# not a build.rs: the generated file is checked in, so an ordinary build of this
# crate needs neither prost-build nor a protoc on PATH. See indexerx::proto.
proto-codegen = ["dep:prost-build"]

default = ["default-tls"]
default-tls = ["rustls-tls"]
rustls-tls = ["reqwest/rustls", "dep:tokio-rustls"]
native-tls = ["reqwest/native-tls", "dep:tokio-native-tls"]

# Enables top-level observability spans and metrics in the core agent operations.
# Disabling this reduces async state machine depth for users who do not need it.
top-level-spans = []

[lints.rust]
# This is temporary whilst we build out the root modules.
unused = "allow"
